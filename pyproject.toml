[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "math-engine-platform"
version = "0.6.0"
description = "Independent, versioned mathematical model execution services"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2.10,<3", "numpy>=1.24,<3", "scipy>=1.11,<2"]

[project.optional-dependencies]
test = ["pytest>=8,<9"]
oracle = ["oracledb>=2,<4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-p no:cacheprovider"
